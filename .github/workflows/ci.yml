name: aevum-ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run network:guard
      - run: npm run env:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run contract:sha

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-direct.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-direct.txt
      - run: python -m compileall contracts scripts tests/direct

      - name: Direct contract tests
        id: direct_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/direct -v 2>&1 | tee direct-tests.txt

      - name: Core GenVM check
        id: core_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          genvm-lint check contracts/aevum_core.py --json 2>&1 | tee core-genvm.json

      - name: Vault GenVM check
        id: vault_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          genvm-lint check contracts/aevum_vault.py --json 2>&1 | tee vault-genvm.json

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostics-${{ github.sha }}
          path: |
            direct-tests.txt
            core-genvm.json
            vault-genvm.json
          if-no-files-found: warn

      - name: Enforce contract checks
        if: always()
        shell: bash
        run: |
          test "${{ steps.direct_tests.outcome }}" = "success"
          test "${{ steps.core_lint.outcome }}" = "success"
          test "${{ steps.vault_lint.outcome }}" = "success"
