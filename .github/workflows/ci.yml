name: aevum-ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run network:guard
      - run: npm run env:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run contract:sha

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-direct.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-direct.txt
      - run: python -m compileall contracts scripts tests/direct
      - run: genvm-lint check contracts/aevum_core.py
      - run: genvm-lint check contracts/aevum_vault.py
      - run: python -m pytest tests/direct -v
