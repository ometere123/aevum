name: aevum-ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GENLAYER_NETWORK: studionet
      NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
      NEXT_PUBLIC_GENLAYER_RPC: https://studio.genlayer.com/api
      NEXT_PUBLIC_GENLAYER_EXPLORER: https://explorer-studio.genlayer.com
      NEXT_PUBLIC_CORE_ADDRESS: 0x1111111111111111111111111111111111111111
      NEXT_PUBLIC_VAULT_ADDRESS: 0x2222222222222222222222222222222222222222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run network:guard
      - run: npm run env:check -- --required
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run contract:sha

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-direct.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-direct.txt
      - run: python -m compileall contracts scripts tests/direct
      - run: mkdir -p artifacts

      - name: Direct contract tests
        run: python -m pytest tests/direct -v

      - name: Core GenVM check
        run: genvm-lint check contracts/aevum_core.py --json

      - name: Vault GenVM check
        run: genvm-lint check contracts/aevum_vault.py --json

      - name: Core schema
        run: genvm-lint schema contracts/aevum_core.py --output artifacts/aevum_core.schema.json

      - name: Vault schema
        run: genvm-lint schema contracts/aevum_vault.py --output artifacts/aevum_vault.schema.json

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostics-${{ github.sha }}
          path: |
            artifacts/aevum_core.schema.json
            artifacts/aevum_vault.schema.json
          if-no-files-found: warn
